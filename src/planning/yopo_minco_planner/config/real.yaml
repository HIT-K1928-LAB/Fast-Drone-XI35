# Deployment parameters; these limits are starting points, not flight validation.
odom_topic: /kf_fusion/kf_imu_odom
depth_topic: /camera/depth/image_rect_raw
state_topic: /mavros/state
goal_topic: /move_base_simple/goal
trigger_topic: /traj_start_trigger
stop_topic: /yopo_minco/stop
camera_extrinsic_key: body_T_cam0
plan_from_reference: false
depth_replan_rate: 10.0
ctrl_dt: 0.02
visualize: true
velocity: 0.5
# Model contract: keep aligned with the trained/exported checkpoint.
training_velocity: 6.0
training_acceleration: 6.0
tail_range: 10.0
horizontal_fov: 90.0
vertical_fov: 60.0
horizontal_anchor_fov: 30.0
vertical_anchor_fov: 30.0
duration_min: 0.1
radius_lambda: 2.0
depth_width: 640
depth_height: 480
min_depth: 0.04
max_depth: 20.0
# Predicted corridor threshold, NOT a measured physical-clearance guarantee.
#safe 0.35→0.20
safe_radius: 0.20 
max_speed: 0.8
max_acceleration: 1.5
max_jerk: 10.0
min_height: 0.6
max_height: 1.5
height_band: 0.3
test_radius: 3.0
max_duration: 120.0
check_dt: 0.02
goal_min_distance: 0.5
goal_max_distance: 2.0
hover_speed: 0.15
arrive_distance: 0.25
arrive_speed: 0.15
arrive_hold: 0.5
sensor_timeout: 0.3
state_timeout: 1.0
max_sensor_skew: 0.1
plan_timeout: 0.25
max_tracking_error: 0.5
max_invalid_depth_fraction: 0.3
